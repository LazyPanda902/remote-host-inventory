[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-host-inventory"
version = "0.1.0"
description = "Offline SSH asset inventory validation, credential-field detection, and duplicate target identification."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LazyPanda902"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
remote-host-inventory = "remote_host_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
